version: 1.0
analysis:
  - term: 고객 피로도
    aliases:
      - 고객별 발송량
      - 고객 메시지 피로도
    metrics:
      - request_count
    dimensions:
      - customer
      - request_date
      - channel
      - notification_type

  - term: 발송 성과 분석
    aliases:
      - 발송 성과
      - 발송 결과 분석
      - 발송 현황 분석
    metrics:
      - request_count
      - send_success_count
      - send_fail_count
      - delivery_rate
    dimensions:
      - request_date
      - channel
      - notification_type
      - workspace
      - organization
      - service
