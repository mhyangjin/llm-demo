metric_name: request_fail_count
business_name: 발송 요청 실패 건수
description: >
  발송 요청된 전체 건수

aggregate: count
table: notification_status
filter:
  - column: status
    operator: "="
    value: REQUEST
  - column: result
    operator: "="
    value: FAIL
supported_dimensions:
  - error_code
default_dimension:
  - request_date