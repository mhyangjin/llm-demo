metric_name: send_success_count
business_name: 발송 성공 건수
description: >
  발송이 성공한 전체 건수

aggregate: count
table: notification_status
filter:
  - column: status
    operator: "!="
    value: REQUEST
  - column: result
    operator: "="
    value: SUCCESS
supported_dimensions:
  - channel
  - event
  - workspace
  - organization
  - service
  - template
  - custom_data
default_dimension:
  - request_date